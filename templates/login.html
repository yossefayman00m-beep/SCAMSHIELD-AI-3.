
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SCAMSHIELD AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #203c62 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #30245e 0, transparent 35%),
        #101827;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    color: #f4f8ff;
}

.login-card {
    width: 100%;
    max-width: 440px;
    padding: 42px 35px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    background: rgba(25, 39, 60, .78);
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
    backdrop-filter: blur(18px);
}

.brand {
    text-align: center;
    margin-bottom: 30px;
}

.brand img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 12px;
}

.brand h1 {
    font-size: 25px;
    letter-spacing: 2px;
}

.brand p {
    color: #aab8cc;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 7px;
}

.heading {
    text-align: center;
    margin-bottom: 28px;
}

.heading h2 {
    font-size: 27px;
    margin-bottom: 9px;
}

.heading p {
    color: #aab8cc;
    font-size: 14px;
    line-height: 1.6;
}

.flash {
    background: rgba(255, 181, 71, .12);
    border: 1px solid rgba(255, 181, 71, .4);
    color: #ffcf85;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 18px;
    font-size: 13px;
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: bold;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #34445e;
    outline: none;
    background: #111e30;
    color: white;
    font-size: 14px;
    transition: .25s;
}

input:focus {
    border-color: #16c7b7;
    box-shadow: 0 0 0 3px rgba(22,199,183,.13);
}

input::placeholder {
    color: #8190a7;
}

.show-password {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #16c7b7;
    cursor: pointer;
    font-size: 12px;
}

.login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(110deg, #16c7b7, #12a99e);
    color: #071c25;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: .25s;
    margin-top: 7px;
}

.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(22,199,183,.25);
}

.bottom-text {
    text-align: center;
    color: #aab8cc;
    font-size: 14px;
    margin-top: 25px;
    line-height: 2;
}

a {
    color: #16c7b7;
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 17px;
    color: #aab8cc;
    font-size: 13px;
}

.security-note {
    text-align: center;
    color: #8190a7;
    font-size: 11px;
    margin-top: 28px;
}

@media(max-width: 480px) {
    .login-card {
        padding: 32px 22px;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <img src="{{ url_for('static', filename='d538ddeb-d47d-46ed-b900-54e9f63cf324.png') }}" alt="SCAMSHIELD AI Logo">
        <h1>SCAMSHIELD AI</h1>
        <p>SMART LINK PROTECTION</p>
    </div>

    <div class="heading">
        <h2>Welcome Back</h2>
        <p>Sign in to access your security dashboard.</p>
    </div>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="input-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
                <button type="button" class="show-password"
                    onclick="togglePassword()">SHOW</button>
            </div>
        </div>

        <button type="submit" class="login-btn">
            Sign In →
        </button>

    </form>

    <div class="bottom-text">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create Account</a>
    </div>

    <a href="{{ url_for('index') }}" class="back-home">
        ← Back to Home
    </a>

    <div class="security-note">
        🔒 Your security matters to us.
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
    } else {
        password.type = "password";
        button.textContent = "SHOW";
    }
}
</script>

</body>
</html>
